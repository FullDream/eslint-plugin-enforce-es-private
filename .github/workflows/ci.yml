name: CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - node: '18.18.0'
                      eslint: '8.57.0'
                      typescript: '4.8.4'
                      parser: '8.0.0'
                    - node: '20'
                      eslint: '9'
                      typescript: '5.9.3'
                      parser: '8.71.2'
                    - node: '24'
                      eslint: '10'
                      typescript: '5.9.3'
                      parser: '8.71.2'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            # Install the consumer toolchain separately from the build toolchain.
            - run: node scripts/prepare-compat.cjs
            - run: npm install --prefix .compat --ignore-scripts eslint@${{ matrix.eslint }} @eslint/js@${{ matrix.eslint }} typescript@${{ matrix.typescript }} @typescript-eslint/parser@${{ matrix.parser }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: node --test .compat/tests/*.test.cjs
            - run: npm pack --dry-run
              if: matrix.eslint == '10'
