name: Stage npm package and prepare GitHub Release

on:
    workflow_dispatch:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Validate version and release notes
              id: version
              env:
                  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
              run: node scripts/check-release.cjs

    compatibility:
        needs: validate
        uses: ./.github/workflows/ci.yml

    tag:
        needs: [validate, compatibility]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Create release tag after successful checks
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  release_sha=$(git rev-parse HEAD)
                  if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
                    tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
                    if [ "$tag_sha" != "$release_sha" ]; then
                      echo "::error::Tag $RELEASE_TAG already points to a different commit."
                      exit 1
                    fi
                    echo "Tag $RELEASE_TAG already points to the checked commit."
                  else
                    gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$RELEASE_TAG" -f sha="$release_sha" --silent
                  fi

    stage:
        needs: [validate, tag]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Install npm with staged publishing support
              run: npm install --global npm@11.21.0
            - run: npm ci --ignore-scripts
            # prepack cleans dist and builds the package before staging it.
            - name: Stage package with npm Trusted Publishing
              run: npm stage publish --tag latest
            - name: Record next steps
              run: |
                  cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
                  ## Package staged for review

                  Open npmjs.com → Staged Packages, review this package version,
                  and select Approve with 2FA to publish it to the npm registry.

                  After approval, publish the draft GitHub Release from Releases.
                  EOF

    release:
        needs: [validate, stage]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Prepare draft GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
                    echo "GitHub Release already exists for $RELEASE_TAG."
                  else
                    gh release create "$RELEASE_TAG" --verify-tag --draft \
                      --title "$RELEASE_TAG — native ES private members" \
                      --notes-file "releases/$RELEASE_TAG.md"
                  fi
